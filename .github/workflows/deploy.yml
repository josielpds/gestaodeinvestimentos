name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://plglhbgjiyivsnuzessb.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsZ2xoYmdqaXlpdnNudXplc3NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODc1NDMsImV4cCI6MjEwMzI2MzU0M30.gu4r_9jNa6TZ--UjFbPvJfvINJivBGrRwTDd_gxSu8s' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'plglhbgjiyivsnuzessb' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://plglhbgjiyivsnuzessb.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsZ2xoYmdqaXlpdnNudXplc3NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODc1NDMsImV4cCI6MjEwMzI2MzU0M30.gu4r_9jNa6TZ--UjFbPvJfvINJivBGrRwTDd_gxSu8s' }}
        run: npm run build

      - name: Prepare static files for GitHub Pages
        run: node scripts/prepare-github-pages.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
